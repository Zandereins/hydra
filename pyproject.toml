[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "hydra-core"
version = "2.0.0a0"
requires-python = ">=3.12.3"
# Core deps only. anthropic is bench-only (judge extra); keeping it separate
# avoids false supply-chain signals and unnecessary install bloat for
# headless / agentic contexts.
dependencies = [
  "pydantic>=2.9.0",
  "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0.0",
  "mypy>=1.11.0",
  "ruff>=0.6.0",
  # Type stubs for the pyyaml runtime dep — required for a reproducible
  # `mypy --strict` from a clean install (otherwise yaml imports are untyped).
  "types-PyYAML>=6.0.12",
]
# Judge (bench-only) — direct SDK structured-output call. The contract test
# (test_anthropic_contract) guards the messages.parse + output_format + parsed_output
# surface, so patch/minor fixes can flow; <1.0 guards against the next major.
judge = [
  "anthropic>=0.96,<1.0",
]
bench = [
  "gitpython>=3.1.43",
]

# Re-enable when hydra/cli.py lands (plan Task 42).
# `pip install -e .` succeeds today but `hydra` would fail at import.
# [project.scripts]
# hydra = "hydra.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.hatch.build.targets.wheel]
packages = ["hydra"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["hydra"]
